plugins { id 'com.android.application' }
android {
    namespace 'com.vagabundogames.relatorio'
    compileSdk 34
    signingConfigs { debug { storeFile file('debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
    defaultConfig {
        applicationId "com.vagabundogames.relatorio"
        minSdk 29
        targetSdk 34
        versionCode 3
        versionName "3.0"
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
}
dependencies { implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.webkit:webkit:1.8.0' }
